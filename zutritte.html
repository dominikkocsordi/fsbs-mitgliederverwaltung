<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FSBS">
<title>Zutritte · FSBS</title>
<meta name="theme-color" content="#f4f4f6">
<meta name="robots" content="noindex">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="manifest" href="/favicon/site.webmanifest">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app-shell.js"></script>
<script src="/theme.js"></script>
<link rel="stylesheet" href="style.css">

<style>
  /* ============================================================
     Zutritte — nur das Seitenlayout.
     Karte, Felder, Knöpfe und Hinweisboxen kommen aus style.css;
     die öffentliche Seite hat wie die Abstimmung keine Navigation.
     ============================================================ */
  .bg-gradient { position: fixed; inset: 0; z-index: -2; background: var(--background); }

  .radial-glow {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at 50% 8%,
                color-mix(in oklab, var(--primary) 16%, transparent), transparent 58%);
    pointer-events: none;
  }

  .wrap {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px calc(40px + env(safe-area-inset-bottom, 0px));
  }

  .wrap > .glass {
    width: min(560px, 100%);
    padding: 30px 26px 26px;
    animation: fadeIn 0.55s var(--ease) both;
  }

  @media (min-width: 641px) { .wrap > .glass { padding: 40px 36px 32px; } }

  /* ---------- Kopf der Karte ---------- */
  .zHead { text-align: center; margin-bottom: 30px; }
  .zHead .siteLogoImg { height: 30px; margin: 0 auto 16px; }

  /* Die Karte ist schmaler als eine Seitenspalte – die 48 px der
     Seitenüberschrift wären hier zu laut. */
  .zHead h1 { font-size: clamp(30px, 5vw, 38px); letter-spacing: -0.035em; }

  /* ---------- Felder ---------- */
  .zForm .fieldGrid { gap: 15px; }

  /* Der Zusatz sitzt rechts in der Beschriftungszeile. */
  .zOpt { float: right; font-weight: 400; color: var(--faint-foreground); }

  .zErr {
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--danger);
  }
  .field:not(.has-error) .zErr { display: none; }
  .field.has-error > label { color: var(--danger); }
  .field.has-error input,
  .field.has-error select { border-color: var(--danger); }
  .field.has-error input:focus,
  .field.has-error select:focus {
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--danger) 20%, transparent);
  }

  .zSubmit { margin-top: 24px; }
  .zNotice { margin-top: 14px; }
  .zNotice[hidden] { display: none; }

  /* ---------- Nach dem Absenden ---------- */
  #done { text-align: center; padding: 8px 0 6px; animation: fadeIn 0.45s var(--ease) both; }
  #done svg { display: block; margin: 0 auto 20px; }
  #done .ring { fill: none; stroke: var(--success); stroke-width: 2; opacity: 0.32; }
  #done .tick {
    fill: none;
    stroke: var(--success);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 34;
    stroke-dashoffset: 34;
    animation: zDraw 0.5s var(--ease) 0.14s forwards;
  }
  @keyframes zDraw { to { stroke-dashoffset: 0; } }

  #done h2 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.025em;
    margin: 0 0 6px;
  }
  #done p { margin: 0; color: var(--muted-foreground); font-size: 14px; }

  @media (prefers-reduced-motion: reduce) {
    .wrap > .glass, #done, #done .tick { animation: none; }
    #done .tick { stroke-dashoffset: 0; }
  }

  /* Falle für automatisierte Einträge. */
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
</style>
</head>

<body>
<div class="bg-gradient"></div>
<div class="radial-glow"></div>

<div class="wrap">
  <div class="glass">

    <div class="zHead">
      <img class="siteLogoImg siteLogoImg--light" src="/logo-mark-light.png"
           alt="Fachschaft Business School e.V.">
      <img class="siteLogoImg siteLogoImg--dark" src="/logo-mark-dark.png" alt="" aria-hidden="true">
      <h1>Zutritte</h1>
    </div>

    <form id="form" class="zForm" novalidate autocomplete="on">
      <div class="fieldGrid">

        <div class="field">
          <label for="vorname">Vorname</label>
          <input id="vorname" type="text" autocomplete="given-name" maxlength="80" required>
          <div class="zErr" id="vorname-error"></div>
        </div>

        <div class="field">
          <label for="nachname">Nachname</label>
          <input id="nachname" type="text" autocomplete="family-name" maxlength="80" required>
          <div class="zErr" id="nachname-error"></div>
        </div>

        <div class="field full">
          <label for="email">E-Mail-Adresse</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" maxlength="160" required>
          <div class="zErr" id="email-error"></div>
        </div>

        <div class="field full">
          <label for="ressort">Ressort</label>
          <select id="ressort" required disabled>
            <option value="" selected hidden>Bitte auswählen</option>
          </select>
          <div class="zErr" id="ressort-error"></div>
        </div>

        <div class="field full">
          <label for="rolle">Rolle ab 01.10.2026 <span class="zOpt">Optional</span></label>
          <select id="rolle" disabled>
            <option value="" selected>Keine Angabe</option>
          </select>
        </div>

      </div>

      <div class="hp" aria-hidden="true">
        <label for="webseite">Webseite</label>
        <input id="webseite" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button id="submit" type="submit" class="btn-primary btn--lg btn--block zSubmit">Eintragen</button>
      <p class="notice bad zNotice" id="notice" role="alert" hidden></p>
    </form>

    <div id="done" hidden>
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
        <circle class="ring" cx="28" cy="28" r="25"/>
        <path class="tick" d="M17 29 L25 37 L39 20"/>
      </svg>
      <h2>Eingetragen</h2>
      <p id="done-text"></p>
    </div>

  </div>
</div>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://hdhueuihmxbskiusenpe.supabase.co";
  const SUPABASE_KEY = "sb_publishable_H6YjVStNvwY-VnZuZCYDxw_mOWEvAAW";

  const $ = (id) => document.getElementById(id);
  const form = $("form"), notice = $("notice"), submit = $("submit");

  const showNotice = (text) => { notice.textContent = text; notice.hidden = false; };

  let sb;
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (e) {
    submit.disabled = true;
    showNotice("Die Verbindung zur Datenbank kam nicht zustande. Blockiert vielleicht ein Adblocker die Seite?");
    return;
  }

  /* --- Fehler an einem Feld -------------------------------------------- */
  const setError = (el, text) => {
    el.closest(".field").classList.add("has-error");
    const slot = $(el.id + "-error");
    if (slot) slot.textContent = text;
    el.setAttribute("aria-invalid", "true");
  };
  const clearError = (el) => {
    el.closest(".field").classList.remove("has-error");
    el.removeAttribute("aria-invalid");
  };

  const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;

  const validate = (el) => {
    const wert = el.value.trim();
    if (wert === "") {
      setError(el, el.tagName === "SELECT" ? "Bitte auswählen." : "Bitte ausfüllen.");
      return false;
    }
    if (el.id === "email" && !EMAIL.test(wert)) {
      setError(el, "Diese E-Mail-Adresse sieht nicht vollständig aus.");
      return false;
    }
    clearError(el);
    return true;
  };

  // Die Rolle ist freiwillig und wird deshalb nie geprüft.
  const pflicht = ["vorname", "nachname", "email", "ressort"].map($);
  for (const el of pflicht) {
    el.addEventListener("input",  () => clearError(el));
    el.addEventListener("change", () => clearError(el));
    el.addEventListener("blur",   () => { if (el.value.trim() !== "") validate(el); });
  }

  /* --- Auswahllisten füllen -------------------------------------------- */
  const fuellen = async (select, tabelle) => {
    const { data, error } = await sb.from(tabelle)
      .select("id,name")
      .order("sort_order", { ascending: true })
      .order("name",       { ascending: true });
    if (error) throw error;

    for (const zeile of data) {
      const option = document.createElement("option");
      option.value = zeile.id;
      option.textContent = zeile.name;
      select.append(option);
    }
    if (data.length > 0) select.disabled = false;
    return data.length;
  };

  (async () => {
    const [ressorts] = await Promise.all([
      fuellen($("ressort"), "zutritt_ressorts"),
      fuellen($("rolle"),   "zutritt_rollen")
    ]);
    // Ohne Ressorts lässt sich nichts eintragen – das sagt die Seite dann auch.
    if (ressorts === 0) {
      submit.disabled = true;
      showNotice("Es sind noch keine Ressorts hinterlegt. Bitte später noch einmal vorbeischauen.");
    }
  })().catch((err) => {
    console.error(err);
    submit.disabled = true;
    showNotice("Die Auswahllisten ließen sich nicht laden. Bitte die Seite neu laden.");
  });

  /* --- Absenden --------------------------------------------------------- */
  let laeuft = false;

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (laeuft) return;

    notice.hidden = true;

    let erstesFehlendes = null;
    for (const el of pflicht) if (!validate(el) && !erstesFehlendes) erstesFehlendes = el;
    if (erstesFehlendes) { erstesFehlendes.focus(); return; }

    // Automatischer Eintrag: still bestätigen, aber nichts speichern.
    if ($("webseite").value !== "") { fertig(); return; }

    laeuft = true;
    submit.disabled = true;
    submit.innerHTML = '<span class="spinner spinner--sm"></span>';

    const { error } = await sb.from("zutritte").insert({
      vorname:    $("vorname").value.trim(),
      nachname:   $("nachname").value.trim(),
      email:      $("email").value.trim().toLowerCase(),
      ressort_id: $("ressort").value,
      rolle_id:   $("rolle").value || null
    });

    if (!error) { fertig(); return; }

    if (error.code === "23505") {
      setError($("email"), "Diese E-Mail-Adresse ist bereits eingetragen.");
      $("email").focus();
    } else {
      console.error(error);
      showNotice("Der Eintrag ließ sich nicht speichern. Bitte später noch einmal versuchen.");
    }

    laeuft = false;
    submit.disabled = false;
    submit.textContent = "Eintragen";
  });

  function fertig() {
    const name = $("vorname").value.trim();
    $("done-text").textContent = name
      ? name + ", wir haben deine Angaben."
      : "Wir haben deine Angaben.";
    form.hidden = true;
    $("done").hidden = false;
  }
})();
</script>
</body>
</html>
