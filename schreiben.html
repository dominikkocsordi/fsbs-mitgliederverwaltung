function esc(s){ const d=document.createElement("div"); d.textContent=String(s??""); return d.innerHTML; }

let toastTimer;
function showToast(msg, isError=false){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.toggle("error",isError); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2800);

function autoResize(ta){
  if(!ta) return;

/* Ein Datum, wie es in einem Brief steht: "17. September 2026". */
function langesDatum(iso){
  if(!iso) return "";
  try{
    return new Date(iso+"T12:00:00")
      .toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});
  }catch{ return iso; }
}

/* Absätze eines Textfeldes werden zu Absätzen im Dokument:
   eine Leerzeile trennt, ein einzelner Umbruch bleibt einer. */
function absaetzeHTML(text){
  return String(text||"").split(/\n{2,}/)
    .map(t=>t.trim()).filter(Boolean)
    .map(t=>`<p>${esc(t).replace(/\n/g,"<br>")}</p>`).join("");
}

function hashString(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function initialsFromEmail(email){ const e=(email||"").trim().toLowerCase(); if(!e) return "U"; const local=e.split("@")[0]||"u"; const parts=local.split(/[.\-_]+/).filter(Boolean); return ((parts[0]?.[0]||local[0]||"u").toUpperCase()+(parts[1]?.[0]||local[1]||"").toUpperCase()).trim()||"U"; }
function setAvatar(email){ const e=(email||"").trim().toLowerCase(); if(!e){ authAvatar.classList.add("hidden"); return; } const h=hashString(e); const hue=h%360; const hue2=(hue+38)%360; authAvatar.textContent=initialsFromEmail(e); authAvatar.classList.remove("hidden"); authAvatar.style.background=`linear-gradient(135deg,hsla(${hue},85%,55%,.55),hsla(${hue2},85%,55%,.35))`; }
function normRole(v){ return (v||"").trim().toLowerCase(); }
function roleLabel(r){ if(r==="vorstand") return "Vorstand"; if(r==="ressortleiter") return "Ressortleiter"; if(r==="protokollfuehrer") return "Protokollführer"; return "Unbekannt"; }
function setRolePill(role){ const r=normRole(role); authRolePill.textContent=roleLabel(r); authRolePill.classList.remove("vorstand","ressortleiter"); if(r==="vorstand") authRolePill.classList.add("vorstand"); else authRolePill.classList.add("ressortleiter"); }

async function requireAuthOrRedirect(){ const { data }=await sb.auth.getSession(); if(!data.session){ window.location.replace(LOGIN_PAGE); throw new Error("No session"); } return data.session; }
async function loadMyProfile(session){
  const uid=session?.user?.id; const email=session?.user?.email||"";
  const { data, error }=await sb.from("profiles").select("role,display_name").eq("id",uid).maybeSingle();

  window.FSBSNav?.setRole(data.role);
  return { ...data, email };
}

/* ================================================================
   SPRACHE
   ----------------------------------------------------------------
   Zwei Achsen: über wen wird geschrieben (Zeugnis, dritte Person)
   und mit wem wird gesprochen (Brief, Anrede). Beide Formen stehen
   hier an einer Stelle, damit kein Text sie einzeln zusammenstückelt.
   ================================================================ */

/* Dritte Person — für Zeugnisse und Bescheinigungen. Ohne Anrede
   tritt der Vorname an die Stelle des Pronomens; das liest sich
   ruhiger als jede Schrägstrichform. */
function pron(anrede, vorname){
  const w = anrede === "Frau";
  const m = anrede === "Herr";
  /* Ohne Anrede tritt der Name an die Stelle des Pronomens. Steht
     auch der noch nicht fest, bleibt eine Lücke stehen — sie liest
     sich ehrlicher als ein erfundenes Geschlecht. */
  const n = (vorname||"").trim() || "…";
  const gen = n==="…" ? "…" : (/[sxzß]$/i.test(n) ? n+"’" : n+"s");
  if(w) return { er:"sie", Er:"Sie", ihn:"sie", ihm:"ihr", ihrIhm:"ihr",
                 sein:"ihr", Sein:"Ihr", seine:"ihre", Seine:"Ihre",
                 seinen:"ihren", seinem:"ihrem", seiner:"ihrer", seines:"ihres" };
  if(m) return { er:"er", Er:"Er", ihn:"ihn", ihm:"ihm", ihrIhm:"ihm",
                 sein:"sein", Sein:"Sein", seine:"seine", Seine:"Seine",
                 seinen:"seinen", seinem:"seinem", seiner:"seiner", seines:"seines" };
  return { er:n, Er:n, ihn:n, ihm:n, ihrIhm:n,
           sein:gen, Sein:gen, seine:gen, Seine:gen,
           seinen:gen, seinem:gen, seiner:gen, seines:gen };
}

/* Anrede im Brief — geduzt oder gesiezt. */
function ansprache(duzen){
  if(duzen) return { du:"du", Du:"Du", dich:"dich", dir:"dir",
                     dein:"dein", Dein:"Dein", deine:"deine", Deine:"Deine",
                     deinen:"deinen", deinem:"deinem", deiner:"deiner",
                     hast:"hast", bist:"bist", warst:"warst", wurdest:"wurdest",
                     kannst:"kannst", wirst:"wirst",
                     gib:"gib", melde:"melde dich", schau:"schau" };
  return { du:"Sie", Du:"Sie", dich:"Sie", dir:"Ihnen",
           dein:"Ihr", Dein:"Ihr", deine:"Ihre", Deine:"Ihre",
           deinen:"Ihren", deinem:"Ihrem", deiner:"Ihrer",
           hast:"haben", bist:"sind", warst:"waren", wurdest:"wurden",
           kannst:"können", wirst:"werden",
           gib:"geben Sie", melde:"melden Sie sich", schau:"schauen Sie" };
}

/* Die erste Zeile eines Briefes. */
function anredeZeile(ctx){
  const { anrede, vorname, nachname, duzen } = ctx;
  const voll = [vorname, nachname].filter(Boolean).join(" ") || "…";
  if(duzen){
    if(anrede==="Frau") return `Liebe ${vorname||voll},`;
    if(anrede==="Herr") return `Lieber ${vorname||voll},`;
    return `Hallo ${vorname||voll},`;
  }
  if(anrede==="Frau") return `Sehr geehrte Frau ${nachname||voll},`;
  if(anrede==="Herr") return `Sehr geehrter Herr ${nachname||voll},`;
  return `Guten Tag ${voll},`;
}

function istLeitung(funktion){
  const r=(funktion||"").trim().toLowerCase();
  return r.includes("leitung") || r==="ressortleiter" || r==="ressortleiterin" || r==="stv";
}

/* Aufgabenvorschlag für Ressort und Funktion. */

  const bucket = TASKS[ressort];
  if(!bucket) return ["Mitarbeit in der Fachschaft Business School e.V."];
  return [...(istLeitung(funktion) ? bucket.leitung : bucket.mitglied)];
}

<script>
/* ================================================================
   ZUSTAND
   ================================================================ */
let alleMitglieder = [];
let gefilterte     = [];
let gewaehlt       = null;          // Mitgliedsdatensatz oder null
let vorlageKey     = "zwischenzeugnis";
let daten          = {};            // Feldwerte
let bloecke        = [];            // Absätze des Schreibens
let satzungWahl    = [];            // Schlüssel aus SATZUNG
let unterschriften = [];            // [{name, funktion}]
let gruss          = "Mit freundlichen Grüßen";
let ansicht        = "bearbeiten";  // "bearbeiten" | "vorschau"
let meinName       = "";
let blockId        = 0;

function vorlage(){ return VORLAGEN[vorlageKey]; }
function heute(){ return new Date().toISOString().slice(0,10); }
function duztMan(){ return (daten.ton||"du") === "du"; }

/* Alles, was die Vorlagen zum Schreiben brauchen. */
function kontext(){
  const anrede   = daten.anrede ?? "";
  const vorname  = (daten.vorname||"").trim();
  const nachname = (daten.nachname||"").trim();
  return {
    ...daten,
    anrede, vorname, nachname,
    name: [vorname,nachname].filter(Boolean).join(" ") || "…",
    ressort:  daten.ressort||"",
    funktion: daten.funktion||"Mitglied",
    form:     daten.form||MITGLIEDSFORMEN[0],
    duzen: duztMan(),
    p: pron(anrede, vorname),
    a: ansprache(duztMan()),
  };
}

/* Die Vorlage füllt die Felder, die sie kennt — der Rest bleibt leer. */
function grundwerte(){
  const w = {
    anrede:"", ton:"du", vorname:"", nachname:"", ressort:"", funktion:"Mitglied",
    form: MITGLIEDSFORMEN[0], seit:"", bis:"", datum: heute(),
    endeAm:"", exmatAm:"", erklaertAm:"", anschrift:"",
  };
  if(gewaehlt){
    w.vorname  = gewaehlt.vorname||"";
    w.nachname = gewaehlt.nachname||"";
    w.ressort  = (gewaehlt.ressort||"").trim();
    w.funktion = istLeitung(gewaehlt.rolle) ? "Ressortleitung" : "Mitglied";
    w.anrede   = anredeRaten(gewaehlt.vorname);
    w.form     = formAusStatus(gewaehlt.status);
  }
  return w;
}

/* Ein Vorschlag, mehr nicht: die Ansprache steht als Feld daneben
   und lässt sich in einem Klick ändern. */
function anredeRaten(vorname){
  const fn=(vorname||"").trim();
  if(!fn) return "";
  const ausnahmen=/^(Klaus|Lukas|Elias|Tobias|Matthias|Niklas|Jonas|Thomas|Markus|Andreas|Marius|Luca|Noah|Joshua|Nikola)$/i;
  if(ausnahmen.test(fn)) return "Herr";
  return /[aeiy]$/i.test(fn) ? "Frau" : "Herr";
}

function formAusStatus(status){
  const s=(status||"").trim().toLowerCase();
  if(s.startsWith("anw")) return "Anwärter:in";
  if(s.startsWith("förder")||s.startsWith("foerder")) return "Fördermitglied";
  if(s.startsWith("ehren")) return "Ehrenmitglied";
  return "Ordentliches Mitglied";
}

/* ================================================================
   MITGLIEDER
   ================================================================ */
async function ladeMitglieder(){
  const { data, error } = await sb.from("members")
    .select("id,vorname,nachname,ressort,rolle,status")
    .order("nachname");
  if(error){
    console.error("ladeMitglieder:", error);
    showToast("Mitglieder konnten nicht geladen werden.", true);
    return;
  }
  alleMitglieder = data || [];
  gefilterte = alleMitglieder;
  renderMitgliederliste();
  /* Ressorts, die es nur in der Mitgliederliste gibt, stehen erst
     jetzt zur Auswahl — das Feld wird darum noch einmal gebaut. */
  renderFelder();
}

function filterMitglieder(q){
  const t=(q||"").trim().toLowerCase();
  gefilterte = t
    ? alleMitglieder.filter(m =>
        ((m.vorname||"")+" "+(m.nachname||"")).toLowerCase().includes(t) ||
        (m.ressort||"").toLowerCase().includes(t))
    : alleMitglieder;
  renderMitgliederliste();
}

function renderMitgliederliste(){
  const el=document.getElementById("mpList"); if(!el) return;
  if(gefilterte.length===0){
    el.innerHTML=`<div class="mpEmpty">Keine Mitglieder gefunden</div>`;
    return;
  }
  el.innerHTML = gefilterte.map(m=>{
    const name=[m.vorname,m.nachname].filter(Boolean).join(" ");
    const aktiv = gewaehlt && String(gewaehlt.id)===String(m.id);
    const raus  = (m.status||"").toLowerCase().startsWith("aus");
    return `<div class="mpItem${aktiv?" active":""}" onclick="waehleMitglied('${esc(m.id)}')">
      <div style="flex:1 1 auto;min-width:0;">
        <div style="font-size:13px;">${esc(name)}</div>
        <div class="mpRessort">${esc(m.ressort||"ohne Ressort")} · ${esc(m.status||"–")}${raus?" · ausgetreten":""}</div>
      </div>
    </div>`;
  }).join("");
}

function waehleMitglied(id){
  gewaehlt = alleMitglieder.find(m=>String(m.id)===String(id)) || null;
  vorlageAnwenden({ felderNeu:true });
  showToast(`${[gewaehlt?.vorname,gewaehlt?.nachname].filter(Boolean).join(" ")} übernommen`);
}

function ohneMitglied(){
  gewaehlt = null;
  vorlageAnwenden({ felderNeu:true });
}

/* ================================================================
   VORLAGE ANWENDEN
   ----------------------------------------------------------------
   Ein Wechsel der Art oder der Person setzt Felder und Texte neu.
   Alles danach — jedes getippte Wort — bleibt stehen, bis jemand
   ausdrücklich ↺ drückt.
   ================================================================ */
function vorlageAnwenden({ felderNeu=true } = {}){
  const v = vorlage();
  if(felderNeu){
    const alt = daten;
    daten = grundwerte();
    /* Was die Person nicht betrifft, darf den Wechsel überleben. */
    if(alt.datum) daten.datum = alt.datum;
    if(alt.ton)   daten.ton   = alt.ton;
    if(!gewaehlt && alt.vorname){ daten.vorname=alt.vorname; daten.nachname=alt.nachname; }
  }
  satzungWahl   = [...(v.satzung||[])];
  gruss         = duztMan() ? "Viele Grüße" : "Mit freundlichen Grüßen";
  unterschriften = standardUnterschriften(v.unterschriften||1, v.zweiteFunktion);
  bloeckeNeu();
  renderAlles();
}

function standardUnterschriften(anzahl, zweiteFunktion){
  const liste = [{ name: meinName||"", funktion:"Vorstandsvorsitz" }];
  if(anzahl>1) liste.push({ name:"", funktion: zweiteFunktion || "Vorstand" });
  return liste;
}

function bloeckeNeu(){
  bloecke = vorlage().bloecke(kontext()).map(b=>({ id:++blockId, items:[], ...b, eigen:false }));
}

/* Solange ein Absatz noch so dasteht, wie die Vorlage ihn geschrieben
   hat, zieht er mit den Stammdaten mit: ein nachgetragenes Datum
   steht sofort im Satz. Sobald jemand im Feld etwas ändert, gehört
   der Absatz ihm — dann rührt ihn nur noch das ↺ an. */
function bloeckeMitziehen(){
  const frisch = vorlage().bloecke(kontext());
  let geaendert = false;
  bloecke.forEach(b=>{
    if(b.eigen) return;
    const neu = frisch.find(f=>f.titel===b.titel);
    if(!neu) return;
    if(b.text!==neu.text || (neu.items||[]).join("\u0000")!==(b.items||[]).join("\u0000")){
      b.text = neu.text;
      b.items = [...(neu.items||[])];
      geaendert = true;
    }
  });
  if(geaendert) renderBloecke();
}

/* Ein einzelner Absatz zurück auf die Vorlage — erkannt an seinem
   Titel, damit auch nach Verschieben der Richtige getroffen wird. */
function blockZurueck(id){
  const i = bloecke.findIndex(b=>b.id===id); if(i<0) return;
  const frisch = vorlage().bloecke(kontext()).find(b=>b.titel===bloecke[i].titel);
  if(!frisch){ showToast("Für diesen Absatz gibt es keine Vorlage mehr.", true); return; }
  bloecke[i] = { ...bloecke[i], text:frisch.text, items:[...(frisch.items||[])], eigen:false };
  renderBloecke(); renderVorschau();
  showToast("Absatz aus der Vorlage geholt");
}
</script>

        <div class="stepActions">
          <button class="btn-pick btn-sm" onclick="toggleMitgliederwahl()" id="btnPick" type="button">👥 Mitglied wählen</button>
          <button class="btn-secondary btn-sm" onclick="ohneMitglied()" type="button">Leeres Formular</button>
        </div>
      </div>
      <div class="empfZeile" id="empfZeile"></div>
      <div class="memberPicker" id="memberPicker" style="display:none;">
        <input class="mpSearch" id="mpSearch" type="text" placeholder="Name oder Ressort suchen…" oninput="filterMitglieder(this.value)">
        <div class="mpList" id="mpList"><div class="mpEmpty">Lade Mitglieder…</div></div>
      </div>
      <div class="fieldGrid" id="felderWrap" style="margin-top:14px;"></div>
    </div>

    <div class="stepCard">
      <div class="stepHead">
        <span class="stepNum">3</span>
        <div>
          <div class="stepTitle">Inhalt</div>
          <div class="stepHint">Jeder Absatz lässt sich ändern, verschieben oder löschen. ↺ holt ihn aus der Vorlage zurück.</div>
        </div>
        <div class="stepActions">
          <button class="btn-secondary btn-xs" onclick="alleBloeckeNeu()" type="button">↺ Alle Texte</button>
          <button class="btn-secondary btn-xs" onclick="blockHinzu('text')" type="button">+ Absatz</button>
          <button class="btn-secondary btn-xs" onclick="blockHinzu('liste')" type="button">+ Aufzählung</button>
        </div>
      </div>
      <div class="blockList" id="blockList"></div>
    </div>

    <div class="stepCard">
      <div class="stepHead">
        <span class="stepNum">4</span>
        <div>
          <div class="stepTitle">Satzungsauszug</div>
          <div class="stepHint">Angehängt wird, was angeklickt ist — wörtlich aus der ${esc(SATZUNG_STAND)}.</div>
        </div>
      </div>
      <div id="satzungWrap"></div>
    </div>

    <div class="stepCard">
      <div class="stepHead">
        <span class="stepNum">5</span>
        <div>
          <div class="stepTitle">Gruß &amp; Unterschriften</div>
          <div class="stepHint">Nach § 10 der Satzung vertreten zwei Vorstandsmitglieder den Verein gemeinsam.</div>
        </div>
        <div class="stepActions">
          <button class="btn-secondary btn-xs" onclick="unterschriftHinzu()" type="button">+ Unterschrift</button>
        </div>
      </div>
      <div id="signWrap"></div>
    </div>

  </div>

  <div id="vorschauWrap" style="display:none;">
    <div class="sheetWrap"><div class="briefSheet" id="briefSheet"></div></div>
  </div>

  <div class="exportBar" style="margin-top:14px;">
    <div class="exportInfo">
      <strong id="exportTitel">–</strong>
      <span id="exportSub" style="display:block;margin-top:2px;"></span>
    </div>
    <div class="exportBtns">
      <button class="btn-secondary" onclick="drucken()" type="button">🖨️ Drucken / PDF</button>
      <button class="btn-export" onclick="exportWord()" type="button">📄 Als Word exportieren (.doc)</button>
    </div>
  </div>

  <datalist id="vorstandNamen">
    ${VORSTAND_VORSCHLAG.map(n=>`<option value="${esc(n)}"></option>`).join("")}
  </datalist>`;
}

function setAnsicht(a){
  ansicht=a;
  document.getElementById("tabBearbeiten").classList.toggle("active", a==="bearbeiten");
  document.getElementById("tabVorschau").classList.toggle("active", a==="vorschau");
  document.getElementById("bearbeitenWrap").style.display = a==="bearbeiten" ? "" : "none";
  document.getElementById("vorschauWrap").style.display   = a==="vorschau"   ? "" : "none";
  if(a==="vorschau") renderVorschau();
}

function renderAlles(){
  renderArten();
  renderEmpfaenger();
  renderFelder();
  renderBloecke();
  renderSatzung();
  renderUnterschriften();
  renderVorschau();
  renderMitgliederliste();
}

/* ---- 1 Art des Schreibens ---- */
function renderArten(){
  const el=document.getElementById("artWrap"); if(!el) return;
  el.innerHTML = VORLAGEN_GRUPPEN.map(gruppe=>{
    const eintraege=Object.entries(VORLAGEN).filter(([,v])=>v.gruppe===gruppe);
    if(eintraege.length===0) return "";
    return `<div class="artGruppe">
      <div class="artGruppeTitel">${esc(gruppe)}</div>
      <div class="artGrid">
        ${eintraege.map(([key,v])=>`
          <button class="artCard${key===vorlageKey?" active":""}" onclick="setVorlage('${key}')" type="button">
            <span class="artIcon" aria-hidden="true">${v.icon}</span>
            <span>
              <span class="artLabel">${esc(v.label)}</span>
              <span class="artKurz">${esc(v.kurz)}</span>
            </span>
          </button>`).join("")}
      </div>
    </div>`;
  }).join("");
}

function setVorlage(key){
  if(!VORLAGEN[key] || key===vorlageKey) return;
  vorlageKey=key;
  vorlageAnwenden({ felderNeu:false });
}

/* ---- 2 Empfänger ---- */
function toggleMitgliederwahl(){
  const p=document.getElementById("memberPicker");
  const auf = p.style.display==="none";
  p.style.display = auf ? "" : "none";
  if(auf) document.getElementById("mpSearch")?.focus();
}

function renderEmpfaenger(){
  const el=document.getElementById("empfZeile"); if(!el) return;
  const c=kontext();
  if(gewaehlt){
    el.innerHTML=`<span class="empfChip">
      <span class="empfChipName">${esc([gewaehlt.vorname,gewaehlt.nachname].filter(Boolean).join(" "))}</span>
      <span class="empfChipMeta">${esc(gewaehlt.ressort||"ohne Ressort")} · ${esc(gewaehlt.status||"–")}</span>
      <button class="empfChipWeg" onclick="ohneMitglied()" type="button" title="Auswahl lösen">✕</button>
    </span>`;
  } else {
    el.innerHTML=`<span class="empfLeer">${c.name==="…"?"Noch niemand ausgewählt — Angaben unten von Hand eintragen.":"Freie Eingabe: "+esc(c.name)}</span>`;
  }
}

function ressortOptionen(){
  const ausDaten = alleMitglieder.map(m=>(m.ressort||"").trim()).filter(Boolean);
  return [...new Set([...RESSORTS, ...ausDaten])].sort((a,b)=>a.localeCompare(b,"de"));
}

function renderFelder(){
  const el=document.getElementById("felderWrap"); if(!el) return;
  el.innerHTML = vorlage().felder.map(feldHTML).join("");
  el.querySelectorAll("textarea").forEach(ta=>{
    autoResize(ta);
    ta.addEventListener("input", ()=>autoResize(ta));
  });
}

function feldHTML(key){
  const f=FELDER[key]; if(!f) return "";
  const wert = daten[key] ?? "";
  const klasse = `field${f.voll?" full":""}`;
  if(f.typ==="select"){
    let optionen=f.optionen, werte=f.werte;
    if(key==="ressort"){
      const liste=ressortOptionen();
      optionen=["— kein Ressort —", ...liste];
      werte=["", ...liste];
    }
    const opts=optionen.map((o,i)=>{
      const w=werte[i];
      return `<option value="${esc(w)}"${String(w)===String(wert)?" selected":""}>${esc(o)}</option>`;
    }).join("");
    return `<div class="${klasse}"><label>${esc(f.label)}</label>
      <select onchange="setFeld('${key}',this.value)">${opts}</select></div>`;
  }
  if(f.typ==="textarea"){
    return `<div class="${klasse}"><label>${esc(f.label)}</label>
      <textarea placeholder="${esc(f.platzhalter||"")}" oninput="setFeld('${key}',this.value)">${esc(wert)}</textarea></div>`;
  }
  return `<div class="${klasse}"><label>${esc(f.label)}</label>
    <input type="${f.typ==="date"?"date":"text"}" value="${esc(wert)}"
           placeholder="${esc(f.platzhalter||"")}" oninput="setFeld('${key}',this.value)"></div>`;
}

function setFeld(key, wert){
  const vorher = daten[key];
  daten[key]=wert;
  if(key==="ton"){
    /* Der Gruß folgt dem Tonfall, solange niemand ihn angefasst hat. */
    if(gruss==="Viele Grüße" || gruss==="Mit freundlichen Grüßen"){
      gruss = duztMan() ? "Viele Grüße" : "Mit freundlichen Grüßen";
      renderUnterschriften();
    }
    if(vorher!==wert) showToast("Tonfall geändert — Texte mit ↺ neu holen");
  }
  if(key==="vorname"||key==="nachname") renderEmpfaenger();
  bloeckeMitziehen();
  renderVorschau();
  renderExportInfo();
}
</script>

<script>
/* ---- 3 Inhalt ---- */
function renderBloecke(){
  const el=document.getElementById("blockList"); if(!el) return;
  if(bloecke.length===0){
    el.innerHTML=`<div class="empty emptyBlocks">
      <div class="empty__icon">📝</div>
      <div class="empty__title">Kein Inhalt</div>
      <div>Füge einen Absatz hinzu oder hole die Vorlage zurück.</div>
    </div>`;
    return;
  }
  el.innerHTML = bloecke.map((b,i)=>`
    <div class="block">
      <div class="blockHeader">
        <div class="blockType">
          <span class="blockTypeIcon" aria-hidden="true">${b.art==="liste"?"•":"¶"}</span>
          <span>${esc(b.titel||"Absatz")}</span>
        </div>
        <div class="actions">
          <button class="block-act" onclick="blockZurueck(${b.id})" type="button" title="Aus der Vorlage neu holen">↺</button>
          <button class="block-act" onclick="blockSchieben(${b.id},-1)" type="button" title="Nach oben" ${i===0?"disabled":""}>↑</button>
          <button class="block-act" onclick="blockSchieben(${b.id},1)" type="button" title="Nach unten" ${i===bloecke.length-1?"disabled":""}>↓</button>
          <button class="block-act del" onclick="blockWeg(${b.id})" type="button" title="Entfernen">✕</button>
        </div>
      </div>
      <div class="blockFields">
        <textarea placeholder="${b.art==="liste"?"Einleitender Satz vor der Aufzählung…":"Text des Absatzes…"}"
                  oninput="setBlockText(${b.id},this.value);autoResize(this)">${esc(b.text||"")}</textarea>
        ${b.art==="liste" ? listeHTML(b) : ""}
      </div>
    </div>`).join("");
  el.querySelectorAll("textarea").forEach(autoResize);
}

function listeHTML(b){
  const zeilen=(b.items||[]).map((t,i)=>`
    <div class="bulletRow">
      <span class="bulletDot" aria-hidden="true">•</span>
      <input type="text" value="${esc(t)}" placeholder="Aufgabe oder Punkt…"
             oninput="setBlockItem(${b.id},${i},this.value)">
      <button class="iconBtn" onclick="itemWeg(${b.id},${i})" type="button" title="Punkt entfernen">✕</button>
    </div>`).join("");
  return `<div class="bulletList">${zeilen}
    <div><button class="btn-secondary btn-xs" onclick="itemHinzu(${b.id})" type="button">+ Punkt</button></div>
  </div>`;
}

function findeBlock(id){ return bloecke.find(b=>b.id===id); }

function setBlockText(id, wert){ const b=findeBlock(id); if(!b) return; b.text=wert; b.eigen=true; renderVorschau(); }
function setBlockItem(id, i, wert){ const b=findeBlock(id); if(!b) return; b.items[i]=wert; b.eigen=true; renderVorschau(); }
function itemHinzu(id){ const b=findeBlock(id); if(!b) return; b.items.push(""); b.eigen=true; renderBloecke(); renderVorschau();
  const felder=document.querySelectorAll(".bulletRow input"); felder[felder.length-1]?.focus(); }
function itemWeg(id,i){ const b=findeBlock(id); if(!b) return; b.items.splice(i,1); b.eigen=true; renderBloecke(); renderVorschau(); }

function blockSchieben(id, richtung){
  const i=bloecke.findIndex(b=>b.id===id); const j=i+richtung;
  if(i<0||j<0||j>=bloecke.length) return;
  [bloecke[i],bloecke[j]]=[bloecke[j],bloecke[i]];
  renderBloecke(); renderVorschau();
}

function blockWeg(id){
  bloecke=bloecke.filter(b=>b.id!==id);
  renderBloecke(); renderVorschau();
}

function blockHinzu(art){
  bloecke.push({ id:++blockId, art, titel: art==="liste"?"Aufzählung":"Absatz", text:"", items: art==="liste"?[""]:[], eigen:true });
  renderBloecke(); renderVorschau();
  const felder=document.querySelectorAll("#blockList textarea");
  felder[felder.length-1]?.focus();
}

function alleBloeckeNeu(){
  bloeckeNeu();
  renderBloecke(); renderVorschau();
  showToast("Texte aus der Vorlage geholt");
}

/* ---- 4 Satzungsauszug ---- */
function renderSatzung(){
  const el=document.getElementById("satzungWrap"); if(!el) return;
  const chips=Object.entries(SATZUNG).map(([key,s])=>`
    <button class="satzChip${satzungWahl.includes(key)?" active":""}" onclick="satzungToggle('${key}')" type="button">
      <span class="satzChipRef">${esc(s.ref)}</span> ${esc(s.titel)}
    </button>`).join("");
  const zitate = satzungWahl.map(k=>SATZUNG[k]).filter(Boolean).map(s=>`
    <p><b>${esc(s.ref)} — ${esc(s.titel)}</b><br>„${esc(s.text)}“</p>`).join("");
  el.innerHTML=`<div class="satzChips">${chips}</div>
    ${zitate ? `<div class="satzQuote">${zitate}</div>` : `<div class="satzLeer">Kein Auszug angehängt.</div>`}`;
}

function satzungToggle(key){
  satzungWahl = satzungWahl.includes(key)
    ? satzungWahl.filter(k=>k!==key)
    : [...satzungWahl, key];
  renderSatzung(); renderVorschau();
}

/* ---- 5 Gruß & Unterschriften ---- */
function renderUnterschriften(){
  const el=document.getElementById("signWrap"); if(!el) return;
  const brief = vorlage().art==="brief";
  const grussFeld = brief ? `
    <div class="field" style="max-width:280px;margin-bottom:14px;">
      <label>Grußformel</label>
      <input type="text" value="${esc(gruss)}" oninput="setGruss(this.value)" placeholder="Mit freundlichen Grüßen">
    </div>` : "";
  el.innerHTML = grussFeld + `<div class="signGrid">${
    unterschriften.map((u,i)=>`
      <div class="signCard">
        <div class="signCardHead">
          <span>Unterschrift ${i+1}</span>
          ${unterschriften.length>1?`<button class="iconBtn" onclick="unterschriftWeg(${i})" type="button" title="Entfernen">✕</button>`:""}
        </div>
        <div class="field">
          <label>Name</label>
          <input type="text" list="vorstandNamen" value="${esc(u.name)}" placeholder="Vor- und Nachname"
                 oninput="setUnterschrift(${i},'name',this.value)">
        </div>
        <div class="field">
          <label>Funktion</label>
          <input type="text" value="${esc(u.funktion)}" placeholder="z. B. Vorstandsvorsitz"
                 oninput="setUnterschrift(${i},'funktion',this.value)">
        </div>
      </div>`).join("")
  }</div>`;
}

function setGruss(v){ gruss=v; renderVorschau(); }
function setUnterschrift(i, feld, wert){ if(!unterschriften[i]) return; unterschriften[i][feld]=wert; renderVorschau(); }
function unterschriftHinzu(){
  if(unterschriften.length>=3){ showToast("Mehr als drei Unterschriften passen nicht auf die Zeile.", true); return; }
  unterschriften.push({ name:"", funktion:"Vorstand" });
  renderUnterschriften(); renderVorschau();
}
function unterschriftWeg(i){ unterschriften.splice(i,1); renderUnterschriften(); renderVorschau(); }
</script>

<script>
/* ================================================================
   DAS BLATT
   ----------------------------------------------------------------
   Vorschau, Druck und Word-Datei teilen sich einen Körper. Was in
   der Vorschau steht, steht später auch im Dokument — sonst wäre
   die Vorschau nur ein Bild davon.
   ================================================================ */
function dokumentKoerper(){
  const v=vorlage(), c=kontext();
  const urkunde = v.art==="urkunde";
  const ortDatum = `${VEREIN.sitz}, den ${langesDatum(daten.datum)||langesDatum(heute())}`;
  let h="";

  h+=`<div class="briefKopf">
        <div class="briefKopfName">${esc(VEREIN.name)}</div>
        <div class="briefKopfZeile">${esc(VEREIN.strasse)} · ${esc(VEREIN.ort)} · ${esc(VEREIN.mail)}</div>
      </div>`;

  if(urkunde){
    h+=`<div class="briefTitel">${esc(typeof v.titel==="function" ? v.titel(c) : v.titel)}</div>`;
  } else {
    const anschrift=(daten.anschrift||"").trim();
    h+=`<div class="briefAbsender">${esc(VEREIN.name)} · ${esc(VEREIN.strasse)} · ${esc(VEREIN.ort)}</div>`;
    h+=`<div class="briefAnschrift">${esc([c.anrede,c.name].filter(Boolean).join(" "))}${
          anschrift ? "<br>"+esc(anschrift).replace(/\n/g,"<br>") : ""}</div>`;
    h+=`<div class="briefDatum">${esc(ortDatum)}</div>`;
    const betreff = typeof v.betreff==="function" ? v.betreff(c) : "";
    if(betreff) h+=`<div class="briefBetreff">${esc(betreff)}</div>`;
  }

  for(const b of bloecke){
    h+=absaetzeHTML(b.text);
    if(b.art==="liste"){
      const punkte=(b.items||[]).map(t=>String(t).trim()).filter(Boolean);
      if(punkte.length) h+=`<ul class="briefListe">${punkte.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
    }
  }

  const zitate = satzungWahl.map(k=>SATZUNG[k]).filter(Boolean);
  if(zitate.length){
    h+=`<div class="briefZitat">
      <div class="briefZitatKopf">Auszug aus der Satzung der ${esc(VEREIN.name)} (${esc(SATZUNG_STAND)})</div>
      ${zitate.map(s=>`<p><b>${esc(s.ref)} — ${esc(s.titel)}</b><br>„${esc(s.text)}“</p>`).join("")}
    </div>`;
  }

  if(urkunde) h+=`<p class="briefOrt">${esc(ortDatum)}</p>`;
  else if(gruss.trim()) h+=`<p class="briefGruss">${esc(gruss)}</p>`;

  h+=unterschriftenHTML();

  h+=`<div class="briefFuss">${esc(VEREIN.name)} · ${esc(VEREIN.strasse)} · ${esc(VEREIN.ort)} · ${esc(VEREIN.mail)}</div>`;
  return h;
}

function unterschriftenHTML(){
  const gueltig = unterschriften.filter(u=>(u.name||"").trim() || (u.funktion||"").trim());
  if(gueltig.length===0) return "";
  const breite = Math.floor(84/gueltig.length);
  const zellen = gueltig.map(u=>
    `<td class="briefSigZelle" width="${breite}%">${esc(u.name||"")}<br><span class="briefSigRolle">${esc(u.funktion||"")}</span></td>`
  ).join(`<td class="briefSigLuecke"></td>`);
  return `<table class="briefSig" width="100%"><tr>${zellen}</tr></table>`;
}

/* Die Gestalt des Blattes — einmal für Vorschau (style.css) und
   einmal für Word und Druck, dort in Punkt statt Pixel. */
const DOKUMENT_CSS = `
  @page{ margin:2.5cm 2.5cm 2cm 2.5cm; }
  body{ font-family:Arial,"Helvetica Neue",sans-serif; font-size:11pt; color:#1a1a1a; line-height:1.6; }
  p{ margin:0 0 8pt; }
  .briefKopf{ border-bottom:1.5pt solid #1a1a1a; padding-bottom:6pt; margin-bottom:22pt; }
  .briefKopfName{ font-size:13pt; font-weight:bold; letter-spacing:0.02em; }
  .briefKopfZeile{ font-size:8.5pt; color:#555; margin-top:2pt; }
  .briefAbsender{ font-size:7.5pt; color:#666; border-bottom:0.5pt solid #bbb; padding-bottom:2pt; margin-bottom:8pt; }
  .briefAnschrift{ font-size:11pt; line-height:1.45; margin-bottom:24pt; }
  .briefDatum{ text-align:right; font-size:10pt; color:#444; margin-bottom:22pt; }
  .briefBetreff{ font-size:11.5pt; font-weight:bold; margin-bottom:16pt; }
  .briefTitel{ text-align:center; font-size:16pt; font-weight:bold; letter-spacing:0.06em; text-transform:uppercase; margin:6pt 0 22pt; }
  .briefListe{ margin:4pt 0 10pt; padding-left:18pt; }
  .briefListe li{ margin:3pt 0; }
  .briefZitat{ border-left:2pt solid #888; background:#f5f5f5; padding:8pt 12pt; margin:14pt 0; font-size:9.5pt; color:#333; }
  .briefZitatKopf{ font-size:8.5pt; text-transform:uppercase; letter-spacing:0.05em; color:#666; margin-bottom:6pt; }
  .briefZitat p{ margin:0 0 6pt; }
  .briefGruss{ margin-top:16pt; }
  .briefOrt{ margin-top:18pt; }
  .briefSig{ border-collapse:collapse; margin-top:46pt; }
  .briefSigZelle{ border-top:0.75pt solid #555; padding-top:5pt; text-align:center; font-size:10pt; vertical-align:top; }
  .briefSigRolle{ font-size:8.5pt; color:#555; }
  .briefSigLuecke{ width:8%; }
  .briefFuss{ margin-top:30pt; padding-top:6pt; border-top:0.5pt solid #ccc; text-align:center; font-size:8pt; color:#777; }
`;

function dokumentHTML(){
  const titel = dateiTitel();
  return `<html xmlns:o='urn:schemas-microsoft-com:office:office'
    xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset='utf-8'><title>${esc(titel)}</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->
  <style>${DOKUMENT_CSS}</style>
  </head><body>${dokumentKoerper()}</body></html>`;
}

/* ---- Vorschau ---- */
function renderVorschau(){
  const el=document.getElementById("briefSheet");
  if(el) el.innerHTML = dokumentKoerper();
  renderExportInfo();
}

function renderExportInfo(){
  const v=vorlage(), c=kontext();
  const t=document.getElementById("exportTitel");
  const s=document.getElementById("exportSub");
  const m=document.getElementById("composerMeta");
  if(t) t.textContent = v.label;
  if(s) s.textContent = (c.name==="…" ? "ohne Empfänger" : "für "+c.name) + " · " + dateiName() + ".doc";
  if(m) m.textContent = v.gruppe + " · " + (v.art==="urkunde" ? "Urkundenform" : "Briefform");
}

function dateiTitel(){
  const v=vorlage(), c=kontext();
  return v.art==="urkunde"
    ? (typeof v.titel==="function" ? v.titel(c) : v.titel)
    : (typeof v.betreff==="function" ? (v.betreff(c) || v.label) : v.label);
}

function dateiName(){
  const c=kontext();
  const teile=[
    vorlage().dateiname,
    (c.nachname||"").replace(/[^\wäöüÄÖÜß-]/g,""),
    (c.vorname||"").replace(/[^\wäöüÄÖÜß-]/g,""),
  ].filter(Boolean);
  return teile.join("_") || "Schreiben";
}

/* ---- Word ---- */
function exportWord(){
  if(bloecke.length===0){ showToast("Das Schreiben hat noch keinen Inhalt.", true); return; }
  const blob=new Blob(["﻿", dokumentHTML()], { type:"application/msword" });
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`${dateiName()}.doc`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("✅ Schreiben exportiert");
}

/* ---- Druck / PDF ---- */
function drucken(){
  if(bloecke.length===0){ showToast("Das Schreiben hat noch keinen Inhalt.", true); return; }
  const w=window.open("", "_blank");
  if(!w){ showToast("Der Browser hat das Druckfenster blockiert.", true); return; }
  w.document.write(`<!doctype html><html lang="de"><head><meta charset="utf-8">
    <title>${esc(dateiTitel())}</title>
    <style>${DOKUMENT_CSS}
      body{ max-width:17cm; margin:1.5cm auto; background:#fff; }
      @media print{ body{ margin:0; max-width:none; } }
    </style></head><body>${dokumentKoerper()}</body></html>`);
  w.document.close();
  w.focus();
  setTimeout(()=>{ w.print(); }, 350);
}

function keinZugriff(text){
  document.getElementById("pageLoader").classList.add("hidden");
  const mc=document.getElementById("mainContent");
  mc.style.display="";
  mc.innerHTML=`<div class="glass card" style="text-align:center;padding:48px 24px;">
      <div style="font-size:32px;margin-bottom:12px;">⛔</div>
      <div style="font-weight:600;font-size:16px;">Kein Zugriff</div>
      <div style="margin-top:6px;color:var(--muted-foreground);">${esc(text)}</div>
    </div>`;
}

(async()=>{
  try{
    const session = await requireAuthOrRedirect();
    const profile = await loadMyProfile(session);

    /* Schreiben gehen im Namen des Vereins hinaus — das bleibt beim Vorstand. */
    if(normRole(profile.role)!=="vorstand"){
      keinZugriff("Diese Seite ist nur für den Vorstand.");
      return;
    }

    meinName = (profile.display_name||"").trim();

    renderPage();
    daten = grundwerte();
    vorlageAnwenden({ felderNeu:false });
    document.getElementById("pageLoader").classList.add("hidden");
    document.getElementById("mainContent").style.display="";

    await ladeMitglieder();
  }catch(e){
    if(e?.message==="kein_profil"){
      setAuthUI(false);
      keinZugriff("Deine E-Mail ist nicht freigeschaltet.");
    }else{
      console.error(e);
    }
  }
})();
