<script>
/* ============================================================
   FSBS INTERN — Dashboard
   ------------------------------------------------------------
   Die Startseite beantwortet zwei Fragen und sonst keine:
   Wie stehen die Zahlen, die meine Rolle angehen — und was ist
   offen? Alles Weitere steht auf der Seite, zu der es gehört.

     Vorstand        der ganze Verein
     Ressortleiter   sein Ressort
     Protokollführer kein Dashboard, wird weitergeleitet

   Abgefragt wird nur, was die Rolle ohnehin lesen darf (siehe die
   Zugriffsregeln in supabase/*.sql). Jede Abfrage steht für sich:
   fällt eine aus, fehlt ihre Zahl — die Seite bleibt stehen.
   ============================================================ */

/* ========= Supabase ========= */
const SUPABASE_URL = "https://hdhueuihmxbskiusenpe.supabase.co";
const SUPABASE_KEY = "sb_publishable_H6YjVStNvwY-VnZuZCYDxw_mOWEvAAW";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const LOGIN_PAGE = "/login";

/* ========= Tabellen ========= */
const PROFILES_TABLE = "profiles";
const MEMBERS_TABLE  = "members";
const CAND_TABLE     = "anwaerter";
const BEW_TABLE      = "bewerbungen";

const CAND_STATUS_COL = "bewerbung_status";

/* Apps Script: Anwesenheit MV und die Belegliste der Finanzen */
const MV_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJtYsEQbqqrp0gyfPp5caDitVndT1SwiLTSi1ybtf63_27UUv07wnlESYrP5-Cf2SEtA/exec";
const FINANZ_APP_URL     = "https://script.google.com/macros/s/AKfycbxvGgyKd8-zZ87ZvB1lPX4WcVpv5KYvx7ikEYxhvgDtJ4I8XOmAvT_IsIB5p4vloc3A/exec";

/* Eine Bewerbung, die noch im Verfahren steckt — dieselben Stände
   wie auf /bewerbungen, ohne `anwaerter` und `abgelehnt`. */
const BEW_LAEUFT = ["offen","geprueft","einladung","kennenlernen","prios_gesendet"];

/* Farbmap der Ressort-Pillen, wie auf den übrigen Seiten. */
const RESSORT_COLORS = {
  "Externe Events":  ["var(--rx-a1)", "var(--rx-a2)"],
  "Interne Events":  ["var(--rx-p1)", "var(--rx-p2)"],
  "Merchandise":     ["var(--rx-g1)", "var(--rx-g2)"],
  "Kommunikation":   ["var(--rx-b1)", "var(--rx-b2)"],
  "Sponsoring":      ["linear-gradient(135deg, var(--rx-a1), var(--rx-p2))", null],
};

function pillStyle(label){
  const key = (label || "").trim();
  const pair = RESSORT_COLORS[key];

  if (pair && pair[1] === null && typeof pair[0] === "string" && pair[0].startsWith("linear-gradient")){
    return `background: ${pair[0]}; border-color: color-mix(in oklab, var(--chart-5) 28%, transparent);`;
  }

  const a = pair?.[0] ?? "var(--surface-2)";
  const b = pair?.[1] ?? "var(--surface-1)";
  const mix = (token, pct) => `color-mix(in oklab, var(${token}) ${pct}%, transparent)`;
  const border =
    key === "Externe Events" ? mix("--chart-1", 30) :
    key === "Interne Events" ? mix("--chart-5", 30) :
    key === "Merchandise"    ? mix("--chart-3", 26) :
    key === "Kommunikation"  ? mix("--chart-2", 28) :
    key === "Sponsoring"     ? mix("--chart-5", 28) :
                               "var(--border-color)";

  return `background: linear-gradient(135deg, ${a}, ${b}); border-color: ${border};`;
}

/* ========= Kleine Helfer ========= */
const safe = (v) => (v === null || v === undefined) ? "" : String(v);
const esc  = (s) => safe(s)
  .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
  .replaceAll('"',"&quot;").replaceAll("'","&#039;");

function normRole(v){ return (v || "").trim().toLowerCase(); }

function roleLabel(role){
  const r = normRole(role);
  if (r === "vorstand") return "Vorstand";
  if (r === "ressortleiter") return "Ressortleiter";
  if (r === "protokollfuehrer") return "Protokollführer";
  return "Unbekannt";
}

const kleinschrift = (v) => safe(v).trim().toLowerCase();

function tageHer(iso){
  if (!iso) return null;
  const t = new Date(iso).getTime();
  if (!isFinite(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}

function anteil(teil, ganz){
  return ganz ? Math.round((teil / ganz) * 100) : 0;
}

/* ========= Auth-UI ========= */
const authBadge = document.getElementById("authBadge");
const authDot = document.getElementById("authDot");
const authState = document.getElementById("authState");
const authMail  = document.getElementById("authMail");
const authAvatar = document.getElementById("authAvatar");
const authCompact = document.getElementById("authCompact");
const authNameInline = document.getElementById("authNameInline");
const authRolePill = document.getElementById("authRolePill");
const authToggle = document.getElementById("authToggle");
const authDetails = document.getElementById("authDetails");

function closeAuthDetails(){
  authDetails.classList.add("hidden");
}

authToggle?.addEventListener("click", (e)=>{
  e.stopPropagation();
  authDetails.classList.toggle("hidden");
});

document.addEventListener("click", (e)=>{
  if (!authBadge.contains(e.target)) closeAuthDetails();
});

function hashString(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0);
}

function initialsFromEmail(email){
  const e = (email || "").trim().toLowerCase();
  if (!e) return "U";
  const local = e.split("@")[0] || "u";
  const parts = local.split(/[.\-_]+/).filter(Boolean);
  const a = (parts[0]?.[0] || local[0] || "u").toUpperCase();
  const b = (parts[1]?.[0] || local[1] || "").toUpperCase();
  return (a + b).trim() || a;
}

function initialsFromText(txt){
  const t = (txt || "").trim();
  if (!t) return "U";
  const parts = t.split(/\s+/).filter(Boolean);
  const a = (parts[0]?.[0] || "U").toUpperCase();
  const b = (parts[1]?.[0] || "").toUpperCase();
  return (a + b).trim() || a;
}

function setAvatar(email){
  const e = (email || "").trim().toLowerCase();
  if (!e){
    authAvatar.classList.add("hidden");
    authAvatar.textContent = "U";
    authAvatar.style.background = "var(--secondary)";
    return;
  }
  const h = hashString(e);
  const hue = h % 360;
  const hue2 = (hue + 38) % 360;
  authAvatar.textContent = initialsFromEmail(e);
  authAvatar.classList.remove("hidden");
  authAvatar.style.background = `linear-gradient(135deg, hsla(${hue}, 85%, 55%, .55), hsla(${hue2}, 85%, 55%, .35))`;
}

function setRolePill(role){
  const r = normRole(role);
  authRolePill.textContent = roleLabel(r);
  authRolePill.classList.remove("vorstand","ressortleiter");
  if (r === "vorstand") authRolePill.classList.add("vorstand");
  else authRolePill.classList.add("ressortleiter");
}

function setCompactIdentity(displayName, email){
  const name = (displayName || "").trim();
  const fallback = ((email || "").split("@")[0] || "User").trim();
  authNameInline.textContent = name || fallback;
}

function setAuthUI(isAuthed, email = ""){
  if (isAuthed){
    authDot.classList.remove("warn");
    authDot.classList.add("ok");
    authState.classList.add("hidden");
    authCompact.classList.remove("hidden");
    closeAuthDetails();
    authMail.textContent = (email || "").trim();
    setAvatar(email);
  } else {
    authDot.classList.remove("ok");
    authDot.classList.add("warn");
    authState.classList.remove("hidden");
    authState.textContent = "nicht eingeloggt";
    authCompact.classList.add("hidden");
    closeAuthDetails();
    authMail.textContent = "";
    setAvatar("");
  }
}

async function requireAuthOrRedirect(){
  const { data } = await sb.auth.getSession();
  if (!data.session){
    window.location.replace(LOGIN_PAGE);
    throw new Error("No session");
  }
  return data.session;
}

async function loadMyProfile(session){
  const uid = session?.user?.id;
  const email = session?.user?.email || "";

  const { data, error } = await sb
    .from(PROFILES_TABLE)
    .select("role, display_name, ressort")
    .eq("id", uid)
    .single();

  if (error || !data){
    throw new Error("kein_profil");
  }

  const myRole = normRole(data?.role);
  setCompactIdentity(data?.display_name, email);
  setRolePill(myRole || "ressortleiter");

  const dn = (data?.display_name || "").trim();
  if (dn) authAvatar.textContent = initialsFromText(dn);

  authBadge.title = `${(dn || email || "User")} • ${roleLabel(myRole || "ressortleiter")}`;
  return {
    role: myRole || "ressortleiter",
    display_name: dn,
    ressort: (data?.ressort || "").trim(),
    email
  };
}

async function logout(){
  await sb.auth.signOut();
  window.location.replace(LOGIN_PAGE);
}

/* ============================================================
   Daten holen
   ------------------------------------------------------------
   Jede Abfrage einzeln gekapselt: Was eine Rolle nicht lesen darf
   oder was gerade nicht erreichbar ist, kommt als leere Liste
   zurück — die Zahl fehlt dann, nicht die Seite.
   ============================================================ */
async function hole(fn, fallback = []){
  try{
    const { data, error } = await fn();
    if (error) throw error;
    return data ?? fallback;
  } catch(err){
    console.warn("Dashboard: Abfrage übersprungen —", err?.message || err);
    return fallback;
  }
}

async function ladeAlles(istVorstand){
  const [ mitglieder, anwaerter, bewerbungen, kontenOhneProfil ] = await Promise.all([
    hole(() => sb.from(MEMBERS_TABLE).select("ressort,status")),
    hole(() => sb.from(CAND_TABLE).select(`ressort,${CAND_STATUS_COL},mail,created_at`)),
    hole(() => sb.from(BEW_TABLE).select("ressort_1,ressort_2,status,status_am,created_at")),
    istVorstand ? hole(() => sb.rpc("nutzer_ohne_profil")) : [],
  ]);

  return { mitglieder, anwaerter, bewerbungen, kontenOhneProfil };
}

/* ============================================================
   Auswerten
   ============================================================ */

/* Mitglieder: „Vollmitglied“, „Fördermitglied“ und alles Unbekannte
   zählen als aktiv; die drei Sonderfälle stehen für sich. */
function mitgliedStand(m){
  const s = kleinschrift(m?.status);
  if (s.startsWith("aus")) return "ausgetreten";
  if (s.startsWith("pau")) return "pausiert";
  if (s.startsWith("anw")) return "anwaerter";
  return "aktiv";
}

/* Anwärter: dieselben drei Stände wie auf /anwaerter. */
function anwaerterStand(a){
  const s = kleinschrift(a?.[CAND_STATUS_COL]);
  if (s === "vollmitglied") return "uebernommen";
  if (s === "anwärter abgelehnt" || s === "anwaerter abgelehnt") return "abgelehnt";
  return "offen";
}

const bewLaeuft = (b) => BEW_LAEUFT.includes(kleinschrift(b?.status));

function gleichesRessort(a, b){
  return kleinschrift(a) !== "" && kleinschrift(a) === kleinschrift(b);
}

/* ============================================================
   Bausteine
   ============================================================ */
function statTile({ label, value, sub = "", icon = "✨", href = "#", ton = "", id = "" }){
  return `
    <a class="statTile ${ton}" href="${href}"${id ? ` id="${id}"` : ""}>
      <div class="statTile__head">
        <div class="statTile__label">${esc(label)}</div>
        <div class="statTile__icon" aria-hidden="true">${icon}</div>
      </div>
      <div class="statTile__value">${value}</div>
      <div class="statTile__sub">${sub}</div>
    </a>`;
}

function todoItem({ anzahl, text, href, ton = "" }){
  return `
    <a class="todoItem" href="${href}">
      <span class="todoCount ${ton}">${anzahl}</span>
      <span class="todoText">${esc(text)}</span>
    </a>`;
}

/* Die Liste zeigt nur, was tatsächlich offen ist. Ist nichts offen,
   steht das da — eine leere Karte wäre eine Frage ohne Antwort. */
function offenKarte(eintraege){
  document.getElementById("dashOffen").innerHTML = `
    <section class="card panel">
      <div class="panelTitle">Offen</div>
      ${eintraege.length
        ? `<div class="todoList">${eintraege.join("")}</div>`
        : `<div class="panelEmpty">Nichts liegen geblieben.</div>`}
    </section>`;
}

function begruessung(me){
  const stunde = new Date().getHours();
  const gruss = stunde < 5 ? "Gute Nacht" : stunde < 11 ? "Guten Morgen" : stunde < 18 ? "Guten Tag" : "Guten Abend";
  const name = me.display_name || (me.email.split("@")[0] || "");

  document.getElementById("dashHello").innerHTML = `
    <h2 class="dashHelloTitle">${esc(gruss)}${name ? ", " + esc(name) : ""}</h2>
    <div class="dashHelloMeta">
      <span class="rolePill ${normRole(me.role) === "vorstand" ? "vorstand" : "ressortleiter"}">${esc(roleLabel(me.role))}</span>
      ${me.ressort ? `<span class="badge" style="${pillStyle(me.ressort)}">${esc(me.ressort)}</span>` : ""}
    </div>`;
}

/* ============================================================
   Vorstand — der ganze Verein
   ============================================================ */
function rendereVorstand(daten){
  const { mitglieder, anwaerter, bewerbungen, kontenOhneProfil } = daten;

  const aktive     = mitglieder.filter(m => mitgliedStand(m) === "aktiv").length;
  const anwOffen   = anwaerter.filter(a => anwaerterStand(a) === "offen").length;
  const anwMailOffen = anwaerter.filter(a => anwaerterStand(a) !== "offen" && a?.mail !== true).length;

  const bewOffen      = bewerbungen.filter(bewLaeuft).length;
  const bewUngeprueft = bewerbungen.filter(b => kleinschrift(b?.status) === "offen").length;
  /* Liegt eine laufende Bewerbung über zwei Wochen unverändert,
     wartet dort jemand auf Antwort. */
  const bewLiegen = bewerbungen.filter(b =>
    bewLaeuft(b) && (tageHer(b?.status_am || b?.created_at) ?? 0) > 14).length;

  document.getElementById("dashStats").innerHTML = [
    statTile({ label:"Mitglieder", value:String(aktive), icon:"👥", href:"/members",
               sub:"aktiv im Verein" }),
    statTile({ label:"Bewerbungen", value:String(bewOffen), icon:"📄", href:"/bewerbungen",
               ton: bewUngeprueft > 0 ? "is-warn" : "",
               sub:`${bewUngeprueft} ungeprüft` }),
    statTile({ label:"Anwärter", value:String(anwOffen), icon:"👶🏼", href:"/anwaerter",
               sub:"offen" }),
    statTile({ label:"Offene Belege", value:`<span class="isPending" id="finWert">…</span>`, icon:"🧾",
               href:"/rechnungen", id:"finTile", sub:`<span id="finSub">wird geladen…</span>` }),
  ].join("");

  const offen = [];
  if (bewUngeprueft) offen.push(todoItem({ anzahl:bewUngeprueft, ton:"warn", href:"/bewerbungen",
                       text:"Bewerbungen ungeprüft" }));
  if (bewLiegen)     offen.push(todoItem({ anzahl:bewLiegen, ton:"bad", href:"/bewerbungen",
                       text:"Bewerbungen seit über zwei Wochen ohne Antwort" }));
  if (anwMailOffen)  offen.push(todoItem({ anzahl:anwMailOffen, ton:"warn", href:"/anwaerter",
                       text:"Anwärter ohne Nachricht" }));
  if (kontenOhneProfil.length) offen.push(todoItem({ anzahl:kontenOhneProfil.length, ton:"bad", href:"/nutzer",
                       text:"Konten ohne Profil" }));
  offenKarte(offen);

  /* Die Belegliste hängt an einer Tabelle bei Google und wird
     nachgeladen, statt das Dashboard aufzuhalten. */
  ladeFinanzen();
}

/* ============================================================
   Ressortleiter — sein Ressort
   ============================================================ */
function rendereRessortleiter(daten, me){
  const { mitglieder, anwaerter, bewerbungen } = daten;
  const meinR = me.ressort;

  const aktive = mitglieder.filter(m =>
    gleichesRessort(m?.ressort, meinR) && mitgliedStand(m) === "aktiv").length;
  const aktivImVerein = mitglieder.filter(m => mitgliedStand(m) === "aktiv").length;

  const meineAnwaerter = anwaerter.filter(a => gleichesRessort(a?.ressort, meinR));
  const anwOffen = meineAnwaerter.filter(a => anwaerterStand(a) === "offen");
  const anwAlt   = anwOffen.filter(a => (tageHer(a?.created_at) ?? 0) > 60).length;

  const bewErst  = bewerbungen.filter(b => gleichesRessort(b?.ressort_1, meinR) && bewLaeuft(b));
  const bewZweit = bewerbungen.filter(b => gleichesRessort(b?.ressort_2, meinR) && bewLaeuft(b));
  const bewNeu   = bewErst.filter(b => kleinschrift(b?.status) === "offen").length;

  document.getElementById("dashStats").innerHTML = [
    statTile({ label:"Mitglieder", value:String(aktive), icon:"👥", href:"/members",
               sub: meinR ? `${anteil(aktive, aktivImVerein)} % des Vereins` : "kein Ressort zugeordnet" }),
    statTile({ label:"Anwärter", value:String(anwOffen.length), icon:"👶🏼", href:"/anwaerter",
               sub:"offen" }),
    statTile({ label:"Bewerbungen", value:String(bewErst.length + bewZweit.length), icon:"📄", href:"/bewerbungen",
               ton: bewNeu > 0 ? "is-warn" : "",
               sub:`${bewErst.length} Erstwunsch · ${bewZweit.length} Zweitwunsch` }),
  ].join("");

  const offen = [];
  if (!meinR){
    document.getElementById("dashOffen").innerHTML = `
      <section class="card panel">
        <div class="panelTitle">Kein Ressort zugeordnet</div>
        <div class="panelEmpty">Ohne Ressort lässt sich nichts zusammenstellen, was dir gehört.
        Der Vorstand trägt es unter „Nutzer“ nach.</div>
      </section>`;
    return;
  }
  if (bewNeu)          offen.push(todoItem({ anzahl:bewNeu, ton:"warn", href:"/bewerbungen",
                         text:"neue Bewerbungen auf dein Ressort" }));
  if (anwOffen.length) offen.push(todoItem({ anzahl:anwOffen.length, ton:"info", href:"/anwaerter",
                         text:"Anwärter ohne Entscheidung" }));
  if (anwAlt)          offen.push(todoItem({ anzahl:anwAlt, ton:"bad", href:"/anwaerter",
                         text:"Anwärter seit über zwei Monaten offen" }));
  offenKarte(offen);
}

/* ============================================================
   Belegliste (Finanzen) — nur Vorstand, nur nachgeladen
   ------------------------------------------------------------
   Die Zahlen stehen in einer Tabelle bei Google, den Zugang dazu
   hält `app_secrets`. Klappt eines von beidem nicht, bleibt die
   Kachel stehen und sagt das.
   ============================================================ */
async function ladeFinanzen(){
  const wert = document.getElementById("finWert");
  const sub  = document.getElementById("finSub");
  const kachel = document.getElementById("finTile");
  if (!wert || !sub) return;

  const zeigeFehler = (text) => {
    wert.textContent = "–";
    wert.classList.add("isPending");
    sub.textContent = text;
  };

  try{
    const { data: secret } = await sb.from("app_secrets")
      .select("value").eq("key","finance_sheet_token").maybeSingle();

    const token = secret?.value || "";
    if (!token) return zeigeFehler("Kein Zugang hinterlegt");

    const res = await fetch(`${FINANZ_APP_URL}?token=${encodeURIComponent(token)}`, { cache:"no-store" });
    const json = await res.json();
    if (json?.error) throw new Error(json.error);

    const zeilen = Array.isArray(json.rows) ? json.rows : [];

    /* Dieselbe Lesart wie auf /rechnungen: alles ohne erkennbaren
       Stand gilt als offen. */
    const stand = (r) => {
      const t = safe(r["Status"]).trim().toLowerCase();
      if (t.includes("prüfung")) return "pruefung";
      if (t.includes("bezahlt")) return "bezahlt";
      return "offen";
    };
    const betrag = (v) => {
      if (typeof v === "number" && isFinite(v)) return v;
      const s = safe(v).trim().replace(/\s/g,"").replace(/[^\d.,-]/g,"");
      if (!s) return 0;
      if (s.includes(".") && s.includes(",")) return Number(s.replace(/\./g,"").replace(",",".")) || 0;
      if (s.includes(",")) return Number(s.replace(",",".")) || 0;
      return Number(s) || 0;
    };
    const euro = (n) => new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR", maximumFractionDigits:0 }).format(n || 0);

    const offen = zeilen.filter(r => stand(r) === "offen");
    const pruefung = zeilen.filter(r => stand(r) === "pruefung");
    const summe = offen.reduce((a, r) => a + betrag(r["Beleg Summe"]), 0);

    wert.classList.remove("isPending");
    wert.textContent = String(offen.length);
    sub.textContent = `${euro(summe)} offen · ${pruefung.length} in Prüfung`;
    if (kachel && offen.length > 0) kachel.classList.add("is-warn");
  } catch(err){
    console.warn("Dashboard: Belegliste nicht erreichbar —", err?.message || err);
    zeigeFehler("Belegliste nicht erreichbar");
  }
}

/* ============================================================
   Anwesenheit MV
   ============================================================ */
async function loadMvWidget(){
  const widget  = document.getElementById("mvWidget");
  const totalEl = document.getElementById("mvTotal");
  const splitEl = document.getElementById("mvSplit");
  const quoteEl = document.getElementById("mvQuote");

  if (!totalEl || !splitEl || !quoteEl) return;

  try{
    const [mvRes, { count: memberCount }] = await Promise.all([
      fetch(MV_APPS_SCRIPT_URL, { cache: "no-store" }),
      sb.from(MEMBERS_TABLE).select("*", { count: "exact", head: true }).in("status", ["Vollmitglied", "Fördermitglied"])
    ]);

    if (!mvRes.ok) throw new Error(`HTTP ${mvRes.status}`);
    const json = await mvRes.json();
    if (!json.ok) throw new Error(json.error || "Apps Script Fehler");

    const rows  = json.rows;
    const total = rows.length;
    const yes   = rows.filter(r => {
      const s = String(r.status || "").toLowerCase();
      return s.includes("ja") || s.includes("anwesend");
    }).length;
    const no    = Math.max(0, total - yes);

    totalEl.textContent = String(total);
    splitEl.textContent = `${yes} / ${no}`;

    if (memberCount && memberCount > 0) {
      quoteEl.textContent = `${Math.round((yes / memberCount) * 100)}%`;
    } else {
      quoteEl.textContent = `${yes} Zusagen`;
    }

    widget?.classList.remove("hidden");
  } catch(err){
    console.warn("MV-Widget konnte nicht geladen werden:", err.message);
    /* Ohne Zahlen keine Kachel — eine Reihe Striche hilft niemandem. */
    widget?.classList.add("hidden");
  }
}

/* ============================================================
   Ablauf
   ============================================================ */
async function loadDashboard(){
  const session = await requireAuthOrRedirect();
  const email = session?.user?.email || "";
  setAuthUI(true, email);

  const me = await loadMyProfile(session);
  const istVorstand = normRole(me.role) === "vorstand";

  /* Der Protokollführer hat kein Dashboard — direkt auf seine Seite. */
  if (normRole(me.role) === "protokollfuehrer"){
    window.location.replace("/protokoll");
    return;
  }

  /* Welche Punkte die Rolle sieht, entscheidet app-shell.js. */
  window.FSBSNav?.setRole(me.role);

  begruessung(me);

  const daten = await ladeAlles(istVorstand);
  if (istVorstand) rendereVorstand(daten);
  else             rendereRessortleiter(daten, me);

  document.getElementById("dash").classList.remove("hidden");
}

const _pageLoader = document.getElementById("pageLoader");
(async () => {
  try{
    await loadDashboard();
    await loadMvWidget();
  } catch(e){
    if (e?.message === "kein_profil"){
      setAuthUI(true, "");
      const dash = document.getElementById("dash");
      if (dash){
        dash.classList.remove("hidden");
        dash.innerHTML = `<div class="card panel" style="text-align:center; padding:32px; color:var(--muted-foreground);">
          ⛔ Kein Zugriff – deine E-Mail ist nicht freigeschaltet.
        </div>`;
      }
    } else if (e?.message !== "No session"){
      console.error(e);
      setAuthUI(false);
    }
  } finally {
    if (_pageLoader) _pageLoader.classList.add("hidden");
  }
})();

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(console.warn);
  });
}
