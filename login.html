<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FSBS Intern – Login</title>
  <!-- PWA / App-Meta -->
  <meta name="theme-color" content="#f4f4f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FSBS">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="/app-shell.js"></script>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ============================================================
       Login — eine zentrierte Spalte, sonst nichts
       ============================================================ */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 40px 20px;
    }

    .app {
      width: 100%;
      max-width: 380px;
      padding: 0;
    }

    .loginHead {
      margin-bottom: 26px;
    }

    .loginHead .siteLogo { display: inline-block; }
    .loginHead .siteLogoImg { height: 30px; }

    .loginHead h1 {
      margin: 22px 0 0;
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .loginHead p {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--muted-foreground);
    }

    .glass.card { padding: 26px 24px; }

    .formGrid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field label { margin-bottom: 7px; }

    #btnSend,
    #btnVerify {
      width: 100%;
      height: 46px;
      font-size: 15px;
    }

    #otpInput {
      height: 54px;
      font-family: var(--font-mono);
      font-size: 22px;
      letter-spacing: 0.32em;
      text-indent: 0.32em;
      text-align: center;
    }

    .hint {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--faint-foreground);
    }

    /* Sekundäraktionen als ruhige Textlinks statt zweiter Buttonreihe */
    .textActions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .linkBtn {
      height: auto;
      padding: 0;
      border: 0;
      background: none;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .linkBtn:not(:disabled):hover { color: var(--foreground); }
    .linkBtn:disabled { cursor: default; opacity: 0.55 !important; }

    /* Meldungen: eine Zeile Text, keine bunte Box */
    .msg {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted-foreground);
    }
    .msg:empty { display: none; }
    .msg.error   { color: var(--danger); }
    .msg.success { color: var(--success); }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--faint-foreground);
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="loginHead">
      <a class="siteLogo" href="index.html" title="Fachschaft Business School e.V.">
        <img class="siteLogoImg siteLogoImg--light" src="/logo-mark-light.png"
             alt="Fachschaft Business School e.V." />
        <img class="siteLogoImg siteLogoImg--dark" src="/logo-mark-dark.png" alt="" aria-hidden="true" />
      </a>
      <h1>Anmelden</h1>
      <p>FSBS Intern · Vorstand &amp; Ressortleitung</p>
    </header>

    <div class="glass card">

      <!-- ========== SCHRITT 1: E-Mail ========== -->
      <div id="step1" class="step">
        <div class="formGrid">
          <div class="field">
            <label for="email">E-Mail-Adresse</label>
            <input id="email" type="email" autocomplete="email"
                   inputmode="email" placeholder="name@domain.de" />
          </div>

          <button class="btn-primary" id="btnSend" type="button">Login-Code senden</button>

          <p class="hint">Du erhältst einen 8-stelligen Code per E-Mail.</p>

          <div id="msg1" class="msg"></div>
        </div>
      </div>

      <!-- ========== SCHRITT 2: OTP-Code eingeben ========== -->
      <div id="step2" class="step hidden">
        <div class="formGrid">
          <div class="field">
            <label for="otpInput">Code aus der E-Mail an <strong id="sentTo">–</strong></label>
            <input id="otpInput" type="text"
                   inputmode="numeric" pattern="[0-9]*"
                   maxlength="8" placeholder="00000000"
                   autocomplete="one-time-code" />
          </div>

          <button class="btn-primary" id="btnVerify" type="button" disabled>Einloggen</button>

          <div id="msg2" class="msg"></div>

          <!-- Polling: wird automatisch erkannt, wenn der Link in Safari geklickt wird -->
          <div class="pollWrap" id="pollWrap">
            <span class="pollDot"></span>
            <span>Warte auf Bestätigung …</span>
          </div>

          <div class="textActions">
            <button class="linkBtn" id="btnResend" type="button" disabled>Erneut senden (15s)</button>
            <button class="linkBtn" id="btnBack" type="button">E-Mail ändern</button>
          </div>
        </div>
      </div>

    </div>

    <footer>Fachschaft Business School e.V.</footer>
  </main>
<script>
  const SUPABASE_URL = "https://hdhueuihmxbskiusenpe.supabase.co";
  const SUPABASE_KEY = "sb_publishable_H6YjVStNvwY-VnZuZCYDxw_mOWEvAAW";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const APP_REDIRECT       = "index.html";
  const EMAIL_REDIRECT_TO  = "https://portal.fsbs-hm.de/login.html";

  /* --- DOM-Elemente --- */
  const emailEl    = document.getElementById("email");
  const otpEl      = document.getElementById("otpInput");
  const btnSend    = document.getElementById("btnSend");
  const btnVerify  = document.getElementById("btnVerify");
  const btnResend  = document.getElementById("btnResend");
  const btnBack    = document.getElementById("btnBack");
  const step1      = document.getElementById("step1");
  const step2      = document.getElementById("step2");
  const sentToEl   = document.getElementById("sentTo");
  const msg1El     = document.getElementById("msg1");
  const msg2El     = document.getElementById("msg2");
  const pollWrap   = document.getElementById("pollWrap");

  let currentEmail = "";
  let pollTimer    = null;
  let resendTimer  = null;

  /* --- Hilfsfunktionen --- */
  function setMsg(el, text, kind){
    el.textContent = text || "";
    el.className   = "msg" + (kind ? " " + kind : "");
  }

  /* --- URL-Parameter auslesen (Hash + Query) --- */
  function getParam(name){
    const fromHash  = new URLSearchParams((location.hash || "").replace(/^#/, ""));
    const fromQuery = new URLSearchParams(location.search || "");
    return fromHash.get(name) ?? fromQuery.get(name);
  }
  function cleanUrl(){
    history.replaceState(null, "", location.origin + location.pathname);
  }

  /* --- PKCE / Magic-Link Callback (wenn Link in Safari geklickt und zurück) --- */
  async function handleCallbackIfNeeded(){
    const code = getParam("code");
    if (code){
      const { error } = await sb.auth.exchangeCodeForSession(location.href);
      if (error){
        setMsg(msg1El, "Fehler beim Login-Link: " + error.message, "error");
        return;
      }
      cleanUrl();
    }

    const { data: { session } } = await sb.auth.getSession();
    if (session){
      cleanUrl();
      window.location.replace(APP_REDIRECT);
      return;
    }
  }

  /* --- OTP senden --- */
  async function sendOtp(){
    const email = emailEl.value.trim();
    if (!email) return setMsg(msg1El, "Bitte E-Mail eingeben.", "error");

    btnSend.disabled = true;
    setMsg(msg1El, "Code wird gesendet …", null);

    const { error } = await sb.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: EMAIL_REDIRECT_TO,
        shouldCreateUser: false,
      }
    });

    btnSend.disabled = false;

    if (error){
      setMsg(msg1El, "Fehler: " + error.message, "error");
      return;
    }

    /* Zu Schritt 2 wechseln */
    currentEmail = email;
    sentToEl.textContent = email;
    step1.classList.add("hidden");
    step2.classList.remove("hidden");
    otpEl.focus();
    setMsg(msg2El, "Code gesendet – schau in dein Postfach.", "success");

    startResendCountdown();
    startSessionPolling();
  }

  /* --- OTP verifizieren --- */
  async function verifyOtp(){
    const token = otpEl.value.trim().replace(/\D/g, "");
    if (token.length !== 8){
      return setMsg(msg2El, "Bitte den 8-stelligen Code eingeben.", "error");
    }

    btnVerify.disabled = true;
    setMsg(msg2El, "Code wird geprüft …", null);

    const { data, error } = await sb.auth.verifyOtp({
      email: currentEmail,
      token,
      type: "email",
    });

    if (error){
      btnVerify.disabled = false;
      setMsg(msg2El, "Ungültiger Code – bitte erneut prüfen.", "error");
      otpEl.select();
      return;
    }

    stopPolling();
    setMsg(msg2El, "Eingeloggt – einen Moment …", "success");
    setTimeout(() => window.location.replace(APP_REDIRECT), 600);
  }

  /* ============================================================
     SESSION POLLING
     Prüft alle 2 Sekunden ob eine Session auftaucht.
     Passiert auf iOS 17+ wenn der Magic-Link in Safari
     geklickt wurde – die Session wird dann im gemeinsamen
     localStorage gespeichert und die PWA kann sie abholen.
     ============================================================ */
  function startSessionPolling(){
    stopPolling();
    if (pollWrap) pollWrap.style.display = "";

    pollTimer = setInterval(async () => {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session){
          stopPolling();
          setMsg(msg2El, "Login erkannt – einen Moment …", "success");
          setTimeout(() => window.location.replace(APP_REDIRECT), 500);
        }
      } catch(_){}
    }, 2000);

    /* Nach 5 Minuten aufhören */
    setTimeout(stopPolling, 5 * 60 * 1000);
  }

  function stopPolling(){
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
    if (pollWrap) pollWrap.style.display = "none";
  }

  /* --- Resend-Countdown --- */
  function startResendCountdown(){
    if (resendTimer) clearInterval(resendTimer);
    let sec = 15;
    btnResend.disabled = true;
    btnResend.textContent = `Erneut senden (${sec}s)`;

    resendTimer = setInterval(() => {
      sec--;
      if (sec <= 0){
        clearInterval(resendTimer);
        btnResend.disabled = false;
        btnResend.textContent = "Erneut senden";
        return;
      }
      btnResend.textContent = `Erneut senden (${sec}s)`;
    }, 1000);
  }

  /* --- Events --- */
  btnSend.addEventListener("click", sendOtp);

  emailEl.addEventListener("keydown", e => {
    if (e.key === "Enter") sendOtp();
  });

  /* OTP-Feld: nur Zahlen, automatisch bestätigen bei 8 Stellen */
  otpEl.addEventListener("input", () => {
    const clean = otpEl.value.replace(/\D/g, "").slice(0, 8);
    otpEl.value  = clean;
    btnVerify.disabled = clean.length !== 8;
    if (clean.length === 8) btnVerify.focus();
  });
  otpEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && otpEl.value.trim().length === 8) verifyOtp();
  });

  btnVerify.addEventListener("click", verifyOtp);

  btnResend.addEventListener("click", async () => {
    btnResend.disabled = true;
    setMsg(msg2El, "Code wird erneut gesendet …", null);
    const { error } = await sb.auth.signInWithOtp({
      email: currentEmail,
      options: { emailRedirectTo: EMAIL_REDIRECT_TO, shouldCreateUser: false }
    });
    if (error){
      setMsg(msg2El, "Fehler: " + error.message, "error");
      btnResend.disabled = false;
      return;
    }
    setMsg(msg2El, "Neuer Code gesendet.", "success");
    startResendCountdown();
    startSessionPolling();
  });

  btnBack.addEventListener("click", () => {
    stopPolling();
    if (resendTimer) clearInterval(resendTimer);
    step2.classList.add("hidden");
    step1.classList.remove("hidden");
    otpEl.value = "";
    btnVerify.disabled = true;
    setMsg(msg1El, "", null);
    emailEl.focus();
  });

  /* --- Init --- */
  (async () => {
    await handleCallbackIfNeeded();
    if (!step1.classList.contains("hidden")) emailEl.focus();
  })();

  /* PWA: Service Worker registrieren */
  if ("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(console.warn);
    });
  }
</script>
</body>
</html>
